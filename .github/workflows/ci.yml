name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (echarts ${{ matrix.echarts }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        echarts: ['5.6.0', '6.0.0']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Override echarts version
        run: npm install --no-save echarts@${{ matrix.echarts }}

      - name: Show resolved echarts version
        run: node -p "require('echarts/package.json').version"

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
